spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/CloudShare}

server.servlet.context-path=/api/v1.0

#spring.data.mongodb.auto-index-creation=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

clerk.issuer=${CLERK_ISSUER:https://cool-snipe-97.clerk.accounts.dev}
clerk.jwks-url=${CLERK_JWKS_URL:https://cool-snipe-97.clerk.accounts.dev/.well-known/jwks.json}
clerk.webhook.secret=${CLERK_WEBHOOK_SECRET:}

#supabase storage configuration
supabase.url=${SUPABASE_URL:https://vdnjqyqkvmdprvhqovon.supabase.co}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:cloud-share}

#file upload configuration (chunks are small; actual file goes direct to Supabase)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

#razorpay configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
