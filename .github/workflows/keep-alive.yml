name: Keep Alive

on:
  schedule:
    - cron: '*/10 6-23 * * *'  # every 10 min, 6am-11pm UTC
  workflow_dispatch:             # manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://cloud-share-api-ffmt.onrender.com/api/v1.0/health)
          echo "Health check status: $response"
          if [ "$response" != "200" ]; then
            echo "WARNING: API returned $response"
            exit 1
          fi
          echo "API is alive"
